<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>PS app guide</title>
<!--
  The step card of the token guide (Sources/SetupGuide.swift), docked beside the browser. Built into the app.
  No network, no data: PS app hands it the words of each step, and it passes Back, Next and Close to PS app.
  The pictures are small drawings of Supabase's own buttons, so people know what to look for.
  Animations move only transform and opacity.
-->
<style>
  :root {
    --pink: #EC4E86; --deep: #C8366B; --ink: #F6F1F4; --mute: rgba(246, 241, 244, .66); --faint: rgba(246, 241, 244, .38);
    --line: rgba(255, 255, 255, .09); --sb: #3ECF8E; --sbd: #2BA571; --ok: #3BB273;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; color: var(--ink); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; height: 100%; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
  .hidden { display: none !important; }

  .card { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #1B151D;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.14) inset; padding: 16px 18px 16px; display: flex; flex-direction: column;
    animation: cardIn .5s var(--ease) both; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .glow { position: absolute; width: 360px; height: 360px; left: -40px; top: -230px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(236,78,134,.20), rgba(62,207,142,.06) 60%, transparent); }

  .top { position: relative; display: flex; align-items: center; gap: 9px; height: 24px; }
  .mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(145deg, var(--pink), var(--deep)); display: grid; place-items: center;
    font: 700 9.5px -apple-system; letter-spacing: -.4px; }
  .of { color: var(--faint); font-size: 11.5px; font-weight: 500; }
  .dots { display: flex; gap: 4px; margin-left: auto; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); transition: transform .4s var(--ease), background .3s; }
  .dots i.done { background: rgba(236,78,134,.55); }
  .dots i.now { background: var(--pink); transform: scaleX(2.1); margin: 0 3px; }
  .x { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--faint); margin-left: 8px; transition: background .2s, color .2s; }
  .x:hover { background: rgba(255,255,255,.08); color: var(--ink); }

  .stage { position: relative; flex: 1; margin-top: 14px; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity .32s, transform .5s var(--ease); }
  .slide.out-l { opacity: 0; transform: translateX(-26px); pointer-events: none; }
  .slide.out-r { opacity: 0; transform: translateX(26px); pointer-events: none; }
  .head { display: flex; gap: 11px; align-items: flex-start; }
  .num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px -apple-system;
    background: linear-gradient(145deg, var(--pink), var(--deep)); box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 6px 16px rgba(236,78,134,.45);
    animation: pop .6s var(--ease) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  h1 { font-size: 16.5px; font-weight: 700; letter-spacing: -.25px; line-height: 1.25; padding-top: 4px; }
  .txt { color: var(--mute); font-size: 12.5px; line-height: 1.45; margin-top: 9px; user-select: text; -webkit-user-select: text; }

  /* the picture: a small drawing of what to look for on Supabase's page */
  .pic { position: relative; margin-top: 12px; height: 104px; border-radius: 12px; background: #1C1C1C; overflow: hidden;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.12) inset; display: grid; place-items: center; }
  .pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 40%); pointer-events: none; }
  .sbbtn { position: relative; height: 26px; padding: 0 11px; border-radius: 6px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
    background: #2A2A2A; box-shadow: 0 0 0 .5px rgba(255,255,255,.16) inset; color: #EDEDED; white-space: nowrap; }
  .sbbtn.g { background: var(--sbd); box-shadow: 0 0 0 .5px rgba(62,207,142,.8) inset; color: #fff; }
  .sbbtn.faint { opacity: .45; }
  .split { display: inline-flex; }
  .split .sbbtn:first-child { border-radius: 6px 0 0 6px; }
  .split .sbbtn:last-child { border-radius: 0 6px 6px 0; padding: 0 7px; margin-left: 1px; }
  .sbin { height: 26px; border-radius: 6px; background: #141414; box-shadow: 0 0 0 .5px rgba(255,255,255,.16) inset; display: flex; align-items: center; padding: 0 9px;
    font-size: 12px; color: #EDEDED; overflow: hidden; white-space: nowrap; }
  .sbin.ph { color: rgba(237,237,237,.35); }
  .row { display: flex; gap: 8px; align-items: center; }
  .lbl { color: rgba(237,237,237,.6); font-size: 11.5px; width: 62px; }
  .click { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid var(--pink); pointer-events: none;
    animation: click 1.5s var(--ease) infinite; }
  @keyframes click { 0% { opacity: .95; transform: scale(.35); } 70%, 100% { opacity: 0; transform: scale(1.6); } }
  .hand { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(236,78,134,.55), 0 3px 8px rgba(0,0,0,.5);
    animation: hand 3s var(--ease) infinite; }
  @keyframes hand { 0% { opacity: 0; transform: translate(-46px, 30px); } 20% { opacity: 1; } 45%, 70% { opacity: 1; transform: none; } 55% { transform: scale(.8); } 100% { opacity: 0; transform: none; } }
  .type { display: inline-block; overflow: hidden; vertical-align: bottom; white-space: nowrap; animation: type 3.2s steps(6) infinite; width: 0; }
  @keyframes type { 0% { width: 0; } 45%, 85% { width: 6ch; } 100% { width: 6ch; } }
  .caret { display: inline-block; width: 1.5px; height: 14px; background: var(--sb); margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .radio { width: 210px; padding: 6px 10px; border-radius: 7px; background: #232323; box-shadow: 0 0 0 .5px rgba(255,255,255,.14) inset; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: #EDEDED; }
  .radio + .radio { margin-top: 5px; }
  .radio b { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35) inset; position: relative; flex: none; }
  .radio.on { box-shadow: 0 0 0 1px var(--sb) inset; animation: onCard 3s var(--ease) infinite; }
  .radio.on b::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--sb); animation: fill 3s var(--ease) infinite; }
  @keyframes fill { 0%, 15% { transform: scale(0); } 30%, 100% { transform: scale(1); } }
  @keyframes onCard { 0%, 15% { box-shadow: 0 0 0 .5px rgba(255,255,255,.14) inset; } 30%, 100% { box-shadow: 0 0 0 1px var(--sb) inset; } }
  .badge { margin-left: auto; font-size: 9.5px; color: var(--sb); opacity: .6; }
  .pill { margin-top: 7px; width: 210px; height: 24px; border-radius: 6px; background: #232323; box-shadow: 0 0 0 .5px rgba(255,255,255,.14) inset; display: flex; align-items: center; padding: 0 10px;
    font-size: 11.5px; color: #EDEDED; animation: pill 3s var(--ease) infinite; }
  @keyframes pill { 0%, 45% { opacity: .35; } 60%, 100% { opacity: 1; } }
  .swap { position: relative; width: 132px; height: 26px; }
  .swap .sbbtn { position: absolute; right: 0; top: 0; }
  .swap .a { animation: swapA 3.4s var(--ease) infinite; }
  .swap .b { animation: swapB 3.4s var(--ease) infinite; }
  @keyframes swapA { 0%, 40% { opacity: 1; transform: none; } 50%, 92% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: none; } }
  @keyframes swapB { 0%, 42% { opacity: 0; transform: translateY(6px); } 52%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .tokrow { position: relative; display: flex; width: 260px; }
  .tokrow .sbin { flex: 1; border-radius: 6px 0 0 6px; font: 11.5px ui-monospace, Menlo, monospace; }
  .copy { width: 30px; height: 26px; border-radius: 0 6px 6px 0; background: #2A2A2A; box-shadow: 0 0 0 .5px rgba(255,255,255,.16) inset; display: grid; place-items: center; position: relative; }

  /* Copy step: the one line about the clipboard, with a soft radar */
  .watch { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(59,178,115,.08);
    box-shadow: 0 0 0 .5px rgba(59,178,115,.35) inset; color: var(--mute); font-size: 11px; line-height: 1.4; }
  .radar { position: relative; flex: none; width: 14px; height: 14px; margin-top: 1px; }
  .radar i { position: absolute; inset: 4px; border-radius: 50%; background: var(--ok); }
  .radar b { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--ok); animation: radar 1.6s var(--ease) infinite; }
  .radar b + b { animation-delay: .8s; }
  @keyframes radar { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.8); } }

  .foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; height: 32px; }
  .link { color: var(--faint); font-size: 11.5px; text-decoration: underline; text-underline-offset: 2px; }
  .link:hover { color: var(--mute); }
  .btn { height: 32px; padding: 0 14px; border-radius: 9px; background: rgba(255,255,255,.08); transition: transform .12s, opacity .2s; white-space: nowrap; }
  .btn:active { transform: scale(.96); }
  .btn.go { background: linear-gradient(145deg, var(--pink), var(--deep)); font-weight: 600; box-shadow: 0 3px 10px rgba(236,78,134,.3); }
  .sp { flex: 1; }

  /* the token arrived */
  .got { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 28px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .got.on { opacity: 1; }
  .got .tick { position: relative; width: 66px; height: 66px; margin: 0 auto; border-radius: 50%; background: var(--ok); display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(59,178,115,.4); transform: scale(.3); transition: transform .6s cubic-bezier(.3, 1.6, .5, 1); }
  .got.on .tick { transform: none; }
  .got .tick path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .45s .25s var(--ease); }
  .got.on .tick path { stroke-dashoffset: 0; }
  .got .ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ok); opacity: 0; }
  .got.on .ring { animation: burst .9s .15s var(--ease) both; }
  .got.on .ring + .ring { animation-delay: .32s; }
  @keyframes burst { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(2.2); } }
  .got h1 { margin-top: 16px; padding: 0; }
  .got p { color: var(--mute); margin-top: 4px; }
  .card.done .stage, .card.done .foot { opacity: 0; transform: scale(.97); transition: opacity .25s, transform .4s var(--ease); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="glow"></div>
  <div class="top">
    <div class="mark">PS</div><span class="of" id="of"></span>
    <div class="dots" id="dots"></div>
    <button class="x" id="x" title="Close the guide (Esc)" aria-label="Close the guide"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7m0-7l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="foot" id="foot">
    <button class="btn" id="back">Back</button>
    <button class="link" id="reopen">Open the page again</button>
    <span class="sp"></span>
    <button class="btn go" id="next">Next</button>
    <button class="btn go hidden" id="paste">Paste it myself</button>
  </div>
  <div class="got" id="got"><div>
    <div class="tick"><span class="ring"></span><span class="ring"></span><svg width="30" height="30" viewBox="0 0 26 26"><path d="m7 13.5 4 4L19.5 8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1 id="gotT"></h1><p id="gotP"></p>
  </div></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const send = (o) => { try { webkit.messageHandlers.guide.postMessage(JSON.stringify(o)); } catch (e) {} };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const CHEV = '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M2.5 3.8 5 6.3l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  const COPY = '<svg width="12" height="12" viewBox="0 0 14 14"><rect x="4.5" y="4.5" width="7.5" height="7.5" rx="1.6" fill="none" stroke="#EDEDED" stroke-width="1.3"/><path d="M9.5 2.5V2A1 1 0 0 0 8.5 1H3A1.5 1.5 0 0 0 1.5 2.5v5.5a1 1 0 0 0 1 1h.5" fill="none" stroke="#EDEDED" stroke-width="1.3"/></svg>';
  // Small drawings of Supabase's own controls, spelled as its dashboard spells them.
  const PICS = {
    account: '<div style="width:230px"><div class="sbbtn" style="width:100%;justify-content:center">Continue with GitHub</div>' +
      '<div class="sbin ph" style="margin-top:7px">you@example.com</div><div class="row" style="margin-top:7px;position:relative"><div class="sbbtn g" style="width:100%;justify-content:center">Sign up</div>' +
      '<span class="hand" style="left:108px;top:6px"></span></div></div>',
    generate: '<div class="row" style="position:relative"><div class="sbin ph" style="width:92px">Filter tokens</div>' +
      '<div class="split" style="position:relative"><div class="sbbtn g">Generate new token</div><div class="sbbtn g">' + CHEV + '</div><span class="click" style="left:64px;top:13px"></span></div></div>',
    legacy: '<div style="position:relative;width:250px"><div style="font-size:11.5px;color:#EDEDED">Resource access</div>' +
      '<div style="font-size:11px;color:rgba(237,237,237,.55);margin-top:5px;line-height:1.45">Need a token with full access to your account? ' +
      '<span style="color:#EDEDED;text-decoration:underline;text-underline-offset:2px">Create legacy token</span></div><span class="click" style="left:72px;top:46px"></span></div>',
    name: '<div><div class="row"><span class="lbl">Name</span><div class="sbin" style="width:170px"><span class="type">PS app</span><span class="caret"></span></div></div>' +
      '<div class="row" style="margin-top:8px"><span class="lbl">Expires in</span><div class="sbin" style="width:170px;box-shadow:0 0 0 1px var(--sb) inset">Never</div></div></div>',
    create: '<div class="row" style="position:relative"><div class="sbbtn faint">Cancel</div><div class="sbbtn g">Generate token</div>' +
      '<span class="click" style="left:118px;top:13px"></span></div>',
    copy: '<div><div style="font-size:11.5px;color:#EDEDED;margin-bottom:6px">Token created</div><div class="tokrow"><div class="sbin">sbp_fc3a&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div>' +
      '<div class="copy">' + COPY + '<span class="click" style="left:15px;top:13px"></span></div></div></div>',
  };
  let cur = null, n = 0, last = 0;

  window.__g = {
    show(o) {
      const dir = o.n >= last ? 1 : -1; last = o.n; n = o.n;
      $('card').classList.remove('done'); $('got').classList.remove('on');
      $('of').textContent = 'Step ' + o.n + ' of ' + o.total;
      $('dots').innerHTML = Array.from({ length: o.total }, (_, i) => '<i class="' + (i + 1 < o.n ? 'done' : i + 1 === o.n ? 'now' : '') + '"></i>').join('');
      const el = document.createElement('div');
      el.className = 'slide ' + (dir > 0 ? 'out-r' : 'out-l');
      el.innerHTML = '<div class="head"><span class="num">' + o.n + '</span><h1>' + esc(o.title) + '</h1></div><p class="txt">' + esc(o.text) + '</p>' +
        '<div class="pic">' + (PICS[o.stage] || '') + '</div>' +
        (o.watching ? '<div class="watch"><span class="radar"><b></b><b></b><i></i></span><span>' + esc(o.note) + '</span></div>' : '');
      $('stage').append(el);
      if (cur) { const old = cur; old.classList.add(dir > 0 ? 'out-l' : 'out-r'); setTimeout(() => old.remove(), 520); }
      cur = el;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('out-r', 'out-l')));
      $('back').classList.toggle('hidden', !!o.first);
      // Opening the page again would close Supabase's panel, so it is only offered before the panel opens.
      $('reopen').classList.toggle('hidden', o.stage !== 'account' && o.stage !== 'generate');
      $('next').classList.toggle('hidden', !!o.watching);
      $('paste').classList.toggle('hidden', !o.watching);
    },
    caught(o) {
      $('gotT').textContent = o.title; $('gotP').textContent = o.text;
      $('card').classList.add('done'); $('got').classList.add('on');
    },
  };
  $('next').addEventListener('click', () => send({ type: 'next' }));
  $('back').addEventListener('click', () => send({ type: 'back' }));
  $('reopen').addEventListener('click', () => send({ type: 'reopen' }));
  $('paste').addEventListener('click', () => send({ type: 'paste' }));
  $('x').addEventListener('click', () => send({ type: 'close' }));
  // Esc always backs out (V1.41): it closes the guide and PS app's own window comes back.
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); send({ type: 'close' }); } }, true);
  send({ type: 'ready' });
})();
</script>
</body>
</html>
